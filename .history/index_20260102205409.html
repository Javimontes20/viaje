<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destino Secreto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* === TU ESTILO ORIGINAL (NO TOCADO) === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: Inter, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, .95);
            width: 90%;
            max-width: 580px;
            padding: 55px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .12);
            text-align: center;
        }

        h1 {
            font-weight: 700;
            font-size: 2em;
            margin-bottom: 10px
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 40px
        }

        .question-number {
            font-size: .75em;
            background: #f3f4f6;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .question {
            font-size: 1.35em;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .options button {
            padding: 18px 24px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            background: #fff;
            cursor: pointer;
            font-size: 1em;
            text-align: left;
            transition: .25s;
        }

        .options button:hover {
            border-color: #1a1a1a;
            transform: translateX(6px);
        }

        .progress {
            height: 8px;
            background: #e5e7eb;
            border-radius: 20px;
            margin: 40px 0 30px;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: #1a1a1a;
            transition: width .4s;
        }

        .start-btn {
            padding: 18px 50px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            cursor: pointer;
        }

        .result-code {
            font-size: 3em;
            font-weight: 700;
            letter-spacing: .15em;
            margin: 25px 0;
        }

        .result-text {
            color: #6b7280
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>¿A dónde irías?</h1>
        <p class="subtitle">Descúbrelo sin saberlo</p>

        <div id="quiz"></div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div id="result"></div>
    </div>

    <script>
        const quiz = document.getElementById("quiz");
        const bar = document.getElementById("bar");
        const result = document.getElementById("result");

        let step = 0;
        let phase = 1;

        /* === PUNTUACIONES === */
        let profile = { frio: 0, templado: 0, calor: 0, urbano: 0, naturaleza: 0 };
        let destinationScore = { C1: 0, C2: 0, C3: 0, C4: 0, C5: 0, C6: 0, C7: 0, C8: 0 };

        /* === TEST 1 · PERFIL GENERAL (10) === */
        const test1 = [
            {
                q: "¿Qué clima te apetece?", a: [
                    ["Fresco o frío", () => profile.frio++],
                    ["Templado", () => profile.templado++],
                    ["Calor", () => profile.calor++]
                ]
            },
            {
                q: "¿Ritmo del día?", a: [
                    ["Tranquilo", () => { }],
                    ["Bien aprovechado", () => { }],
                    ["Intenso", () => { }]
                ]
            },
            {
                q: "¿Cuánto caminarías?", a: [
                    ["Lo justo", () => profile.naturaleza++],
                    ["Bastante", () => profile.urbano++],
                    ["Todo el día", () => profile.urbano++]
                ]
            },
            {
                q: "¿Qué entorno prefieres?", a: [
                    ["Ciudad", () => profile.urbano++],
                    ["Naturaleza", () => profile.naturaleza++],
                    ["Algo distinto", () => profile.urbano++]
                ]
            },
            {
                q: "Comida ideal:", a: [
                    ["Local y típica", () => { }],
                    ["Me da igual", () => { }],
                    ["Cadenas conocidas", () => { }]
                ]
            },
            {
                q: "¿Te agobia lo turístico?", a: [
                    ["Sí", () => { }],
                    ["Depende", () => { }],
                    ["No", () => { }]
                ]
            },
            {
                q: "Plan de tarde:", a: [
                    ["Pasear tranquilo", () => { }],
                    ["Mezcla", () => { }],
                    ["No parar", () => { }]
                ]
            },
            {
                q: "Motivo del viaje:", a: [
                    ["Desconectar", () => { }],
                    ["Cambiar de aires", () => { }],
                    ["Salir de la rutina", () => { }]
                ]
            },
            {
                q: "¿Te gusta improvisar?", a: [
                    ["Mucho", () => { }],
                    ["Un poco", () => { }],
                    ["Nada", () => { }]
                ]
            },
            {
                q: "Al volver quieres sentir que…", a: [
                    ["Has descansado", () => { }],
                    ["Lo has aprovechado", () => { }],
                    ["Has vivido algo distinto", () => { }]
                ]
            }
        ];

        /* === TEST 2 · DESTINO FINAL (5) === */
        const test2 = [
            {
                q: "¿Qué te apetece ver más?", a: [
                    ["Arquitectura", ["C1", "C2", "C6"]],
                    ["Paisajes", ["C5", "C7", "C8"]],
                    ["Algo exótico", ["C4"]]
                ]
            },
            {
                q: "Tipo de paseo:", a: [
                    ["Ciudad compacta", ["C1", "C3", "C6"]],
                    ["Naturaleza abierta", ["C5", "C7", "C8"]],
                    ["Caos bonito", ["C4"]]
                ]
            },
            {
                q: "Mejor recuerdo del día:", a: [
                    ["Fotos bonitas", ["C3", "C5", "C6"]],
                    ["Sensación diferente", ["C4", "C7"]],
                    ["Buen ambiente", ["C2", "C8"]]
                ]
            },
            {
                q: "Cómo vuelves a casa:", a: [
                    ["Relajado", ["C5", "C8"]],
                    ["Satisfecho", ["C3", "C6"]],
                    ["Con la cabeza loca", ["C1", "C2", "C4"]]
                ]
            },
            {
                q: "Este viaje es para…", a: [
                    ["Disfrutar", ["C7", "C8"]],
                    ["Explorar", ["C3", "C6"]],
                    ["Impactar", ["C1", "C2", "C4"]]
                ]
            }
        ];

        function start() {
            quiz.innerHTML = `<button class="start-btn" onclick="next()">Empezar</button>`;
        }
        start();

        function next(payload) {
            if (payload) {
                if (typeof payload === "function") payload();
                if (Array.isArray(payload)) payload.forEach(c => destinationScore[c]++);
            }

            let data = phase === 1 ? test1 : test2;
            let total = phase === 1 ? 10 : 5;

            if (step < data.length) {
                const q = data[step];
                quiz.innerHTML = `
        <div class="question-number">${phase === 1 ? "Test 1" : "Test 2"} · ${step + 1}/${total}</div>
        <div class="question">${q.q}</div>
        <div class="options">
            ${q.a.map(o => `<button onclick='next(${JSON.stringify(o[1])})'>${o[0]}</button>`).join("")}
        </div>`;
                step++;
                bar.style.width = `${(step / total) * 100}%`;
            } else {
                if (phase === 1) {
                    phase = 2; step = 0; bar.style.width = "0%";
                    quiz.innerHTML = `<div class="question">Segunda parte…</div>`;
                    setTimeout(next, 800);
                } else {
                    showResult();
                }
            }
        }

        function showResult() {
            const finalCode = Object.keys(destinationScore).reduce((a, b) =>
                destinationScore[a] > destinationScore[b] ? a : b
            );
            quiz.innerHTML = "";
            result.innerHTML = `
        <div class="result-code">${finalCode}</div>
        <p class="result-text">
            Guárdalo.<br>
            No sabrás nada hasta minutos antes del vuelo.
        </p>`;
        }
    </script>
</body>

</html>
